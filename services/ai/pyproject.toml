[project]
name = "kairn-ai"
version = "0.1.0"
description = "Kairn — assistant IA, rapports mensuels exécutifs, explications et serveur MCP (M-10)"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "mcp>=2.2",
  "fpdf2>=2.8",
  "pyyaml>=6",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairn_ai"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"kairn_ai/prompts.py" = ["E501"]  # prompts : une consigne par ligne
"tests/**" = ["S105", "S106", "E501"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fpdf.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
