# golangci-lint v2 (CLAUDE.md §9).
version: "2"
run:
  timeout: 10m
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - gosec
    - nilerr
    - unconvert
  settings:
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1005", "-QF1008"]
    gosec:
      excludes:
        - G104 # erreurs ignorées explicitement (_ =) : couvert par errcheck
        - G115 # conversions d'entiers contrôlées (horodatages, tailles)
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - io.Copy
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    paths:
      - apps/
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
      # CLI et agent : fichiers et URL fournis par l'utilisateur local (configuration, jeton), par conception.
      - path: (cli|agent)/
        linters: [gosec]
        text: "G304|G602|G703|G704"
      # Textes d'aide des champs « secret » des connecteurs, pas des identifiants.
      - path: connectors/webhooks/sources.go
        linters: [gosec]
        text: G101
      # Générateurs (OpenAPI, documentation des connecteurs) : écriture dans le dossier du dépôt passé en argument.
      - path: services/api/cmd/(openapi|docs)/
        linters: [gosec]
        text: "G301|G306|G703"
      # Chemins d'objets validés par objstore.Local.path (confinement sous la racine).
      - path: pkg/objstore/
        linters: [gosec]
        text: G304
formatters:
  enable: [gofmt]
